<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 5 - Formulario con Validación</title>
    <link rel="stylesheet" href="formulario.css" />
  </head>
  <body>
    <h2>Ejercicio 5: Formulario con Validación</h2>

    <form id="miFormulario" onsubmit="validarFormulario(event)">
      <div>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre" />
        <span id="errorNombre" class="error"></span>
      </div>

      <div>
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com" />
        <span id="errorCorreo" class="error"></span>
      </div>

      <div>
        <label for="clave">Contraseña:</label>
        <input type="password" id="clave" placeholder="Ingrese su contraseña" />
        <span id="errorClave" class="error"></span>
      </div>

      <button type="submit" id="btnEnviar">Enviar</button>
    </form>

    <p id="mensajeExito" class="exito"></p>

    <script src="formulario.js"></script>
  </body>
</html>
